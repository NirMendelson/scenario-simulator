<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Scenario Tree</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background:#0b0e14; color:#fff; }
      .container { display: flex; height: 100%; }
      .panel { width: 420px; padding: 16px; border-right: 1px solid #2a2f3a; background:#11131a; color:#fff; overflow:auto; }
      .tree { flex: 1; background:#0b0e14; color:#fff; overflow:hidden; position:relative; }
      .chip { display:inline-block; padding:2px 8px; border-radius: 10px; margin-right:8px; font-size:12px; }
      .geo { background:#1f6feb33; border:1px solid #1f6feb; color:#cfe8ff; }
      .econ { background:#23863633; border:1px solid #238636; color:#c6f6d5; }
      .tech { background:#bf7af033; border:1px solid #bf7af0; color:#f3d9ff; }
      .social { background:#e3b34133; border:1px solid #e3b341; color:#ffe9b0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      h3, h4 { color:#fff; }
      /* Force react-d3-tree link color */
      .rd3t-link { stroke: #e6eaf0 !important; stroke-width: 1.5 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
